[project]
name = "r2ai-model-training"
version = "0.1.0"
description = "Fine-tuning LLMs for radare2 command generation using Transformers + PEFT"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.18.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "trl>=0.7.0",
    "peft>=0.8.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "torch",
    "torchvision",
]

[tool.uv]
# Limit to Linux x86_64 only (our platform)
environments = ["sys_platform == 'linux'"]

