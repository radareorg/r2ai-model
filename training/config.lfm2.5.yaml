# Compact tool-capable local model configuration for the merged r2 dataset.

model:
  name: "LiquidAI/LFM2.5-1.2B-Instruct"
  tokenizer: null

dataset:
  path: "../data/training/radare2_all_agentic_train.jsonl"
  test_split: 0.1
  split_seed: 42
  max_length: 2048

training:
  output_dir: "./output-lfm2.5"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 1e-4
  warmup_steps: 200
  logging_steps: 50
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

quantization:
  method: "bf16"
  use_fast_tokenizer: true

platform:
  linux:
    use_cuda: true
    cuda_visible_devices: "0"
  mac:
    use_mps: true

export:
  gguf: true
  mlx: false
  output_name: "radare2-lfm2.5-1.2b-finetuned"

lora:
  use_lora: true
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
