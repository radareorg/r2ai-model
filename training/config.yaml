# Training Configuration for Radare2 AI Model Fine-tuning

# Model Configuration
model:
  name: "jan-hq/Qwen3-4B-no-think"  # jan-hq Qwen3 model (4B params, transformers compatible)
  # name: "jan-hq/Jan-nano-orig"  # jan-nano model (4B params, qwen3 architecture) - not transformers compatible
  # name: "HuggingFaceTB/SmolLM-135M"  # Default model, can be changed to any HF model (commented)
  tokenizer: null  # Use same as model if null

# Dataset Configuration
dataset:
  path: "../data/training/radare2_all_agentic_train.jsonl"  # Merged training-ready dataset
  test_split: 0.1  # Fraction of data for testing
  split_seed: 42  # Deterministic group-aware split
  max_length: 2048  # Preserve long agentic evidence; batches are padded dynamically

# Training Hyperparameters
training:
  output_dir: "./output"  # Directory to save model checkpoints
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  gradient_checkpointing: true  # Reduce activation memory for 2048-token LoRA training
  learning_rate: 1e-4
  warmup_steps: 500
  logging_steps: 100
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false

# Quantization (for GGUF export)
quantization:
  #  method: "q4_k_m"  # Options: q4_0, q4_1, q5_0, q5_1, q8_0, f16, f32
  method: "bf16"  # Options: q4_0, q4_1, q5_0, q5_1, q8_0, f16, f32
  use_fast_tokenizer: true

# Platform-specific settings
platform:
  linux:
    use_cuda: true
    cuda_visible_devices: "0"  # GPU device IDs
  mac:
    use_mps: true  # For Apple Silicon

# Export settings
export:
  gguf: true  # Export to GGUF format (Linux/NVIDIA)
  mlx: false  # Export to MLX format (Mac)
  output_name: "radare2-qwen3-4b-finetuned"

# Additional options
lora:
  use_lora: true  # Efficient default suitable for a local 4B model
  r: 8
  lora_alpha: 16
  target_modules: "all-linear"  # Portable across supported causal-LM architectures

# Dataset compilation settings (for reference)
dataset_compilation:
  categories: ["crypto", "general", "vulnerability", "exploit", "reverse engineering", "binary analysis", "binary patching", "debugging"]
  num_examples_per_category: 100
